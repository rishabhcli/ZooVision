name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.24"
          enable-cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Segmenting and probing real containers is part of the product, so the
      # tools have to be present for the suite to exercise those paths.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Verify Python
        run: |
          uv run ruff check backend scripts
          uv run ruff format --check backend scripts
          uv run pytest --cov=zoovision --cov-fail-under=90

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Verify repository hygiene
        run: |
          git diff --check
          test -z "$(git ls-files '.env' 'data/raw/**' 'data/clips/**' 'data/analysis/**')"
          ! git grep -n -E '(sk-proj-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|hooks\.slack\.com/services/)'
